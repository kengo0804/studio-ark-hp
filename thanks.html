<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信完了 — Ark Collective</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0a0a0a;color:#ededed;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  overflow:hidden;
}

:root{
  --orange:#f57c2c;
  --border:rgba(255,255,255,0.08);
  --muted:rgba(255,255,255,0.5);
}

/* ─── NAV ─── */
#site-nav{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 40px;height:64px;
  background:rgba(10,10,10,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav-logo{display:flex;flex-direction:column;gap:2px;}
.nav-logo-name{font-size:13px;letter-spacing:0.25em;text-transform:uppercase;font-weight:500;line-height:1;}
.nav-logo-sub{font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);font-weight:400;line-height:1;}

/* ─── CANVAS BACKGROUND ─── */
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

/* ─── CENTER CONTENT ─── */
.wrap{
  position:relative;z-index:1;
  height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:0 40px;
}

/* ─── CHECK MARK ─── */
.check-ring{
  width:72px;height:72px;border-radius:50%;
  border:1px solid rgba(245,124,44,0.4);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:36px;
  position:relative;
  animation:ring-pulse 2.4s ease-in-out infinite;
}
.check-ring::before{
  content:'';
  position:absolute;inset:-8px;
  border-radius:50%;
  border:1px solid rgba(245,124,44,0.12);
  animation:ring-pulse 2.4s ease-in-out infinite 0.4s;
}
@keyframes ring-pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.6;transform:scale(1.04)}
}
.check-icon{
  font-size:28px;color:var(--orange);
  line-height:1;
}

/* ─── TEXT ─── */
.label{
  font-size:10px;letter-spacing:0.35em;text-transform:uppercase;
  color:var(--orange);margin-bottom:20px;
}
.title{
  font-size:clamp(28px,4vw,48px);
  font-weight:500;letter-spacing:-0.04em;line-height:1.1;
  margin-bottom:20px;
}
.title em{font-style:italic;color:var(--orange)}
.desc{
  font-size:13px;color:rgba(255,255,255,0.55);
  line-height:1.9;max-width:400px;
  margin-bottom:48px;
}

/* ─── ACTIONS ─── */
.actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 36px;
  background:var(--orange);color:#0a0a0a;
  font-size:11px;letter-spacing:0.25em;text-transform:uppercase;font-weight:500;
  border-radius:1px;transition:background 0.2s;
}
.btn-primary:hover{background:#e56e1a}
.btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 36px;
  border:1px solid var(--border);color:var(--muted);
  font-size:11px;letter-spacing:0.25em;text-transform:uppercase;
  border-radius:1px;transition:border-color 0.2s,color 0.2s;
}
.btn-ghost:hover{border-color:rgba(255,255,255,0.3);color:#ededed}

@media(max-width:600px){
  #site-nav{padding:0 20px}
  .wrap{padding:0 24px}
  .actions{flex-direction:column;align-items:center;}
  .btn-primary,.btn-ghost{width:100%;justify-content:center;}
}
</style>
</head>
<body>

<nav id="site-nav">
  <a href="StudioArk.html" class="nav-logo">
    <span class="nav-logo-name">Ark Collective</span>
    <span class="nav-logo-sub">Music Production</span>
  </a>
</nav>

<canvas id="bg"></canvas>

<div class="wrap">
  <div class="check-ring">
    <span class="check-icon">✓</span>
  </div>
  <p class="label">Message Sent</p>
  <h1 class="title">ありがとう<br>ございます。</h1>
  <p class="desc">
    お問い合わせを受け付けました。<br>
    内容を確認のうえ、48時間以内にご返信いたします。
  </p>
  <div class="actions">
    <a href="StudioArk.html" class="btn-primary">トップへ戻る →</a>
    <a href="consultation.html" class="btn-ghost">もう一度送る</a>
  </div>
</div>

<script>
/* ── subtle grid + orange glow background (hero と同じイディオム) ── */
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');
const DPR    = Math.min(window.devicePixelRatio || 1, 2);
let W, H, t = 0;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * DPR; canvas.height = H * DPR;
  canvas.style.width  = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);
}

function draw() {
  requestAnimationFrame(draw); t += 0.008;
  ctx.clearRect(0, 0, W, H);

  /* grid */
  ctx.strokeStyle = 'rgba(255,255,255,0.025)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  /* orange radial glow */
  const gx = W * 0.5 + Math.sin(t * 0.7) * W * 0.12;
  const gy = H * 0.5 + Math.cos(t * 0.5) * H * 0.08;
  const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, W * 0.55);
  grad.addColorStop(0,   'rgba(245,124,44,0.10)');
  grad.addColorStop(0.5, 'rgba(245,124,44,0.04)');
  grad.addColorStop(1,   'transparent');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
}

resize();
window.addEventListener('resize', () => { ctx.resetTransform(); resize(); });
draw();
</script>
</body>
</html>
